name: README Info Update

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update commits & lines of code
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, os, re, urllib.request
          from datetime import datetime, timezone

          TOKEN = os.environ["GH_TOKEN"]
          API = "https://api.github.com"
          HDR = {"Authorization": f"Bearer {TOKEN}",
                 "Accept": "application/vnd.github+json",
                 "User-Agent": "readme-stats"}

          def gql(query, variables=None):
              req = urllib.request.Request(
                  API + "/graphql",
                  data=json.dumps({"query": query, "variables": variables or {}}).encode(),
                  headers={**HDR, "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  body = json.loads(r.read() or b"{}")
              if body.get("errors"):
                  raise RuntimeError(body["errors"])
              return body["data"]

          me = gql("query { viewer { login id } }")["viewer"]
          user, uid = me["login"], me["id"]

          year = datetime.now(timezone.utc).year
          contribs = " ".join(
              f'y{y}: contributionsCollection(from: "{y}-01-01T00:00:00Z", to: "{y+1}-01-01T00:00:00Z")'
              " { totalCommitContributions restrictedContributionsCount }"
              for y in range(2019, year + 1))  # 2019 = account creation year, never changes
          by_year = gql(f'query {{ user(login: "{user}") {{ {contribs} }} }}')["user"]
          commits = sum(v["totalCommitContributions"] + v["restrictedContributionsCount"]
                        for v in by_year.values())

          langs = gql(
              'query { user(login: "%s") { repositories(first: 100, ownerAffiliations: OWNER) '
              '{ nodes { isFork primaryLanguage { name } } } } }' % user)["user"]["repositories"]["nodes"]
          from collections import Counter
          counts = Counter(n["primaryLanguage"]["name"] for n in langs
                           if not n["isFork"] and n["primaryLanguage"])
          total_lang = sum(counts.values())
          fav, _ = counts.most_common(1)[0]
          rows = []
          for lang, c in sorted(counts.items(), key=lambda kv: (-kv[1], kv[0]))[:5]:
              pct = c / total_lang * 100
              bar = "█" * round(pct / 5) + "░" * (20 - round(pct / 5))
              rows.append(f"{lang} | {c} repos | {bar} | {pct:.2f}%")
          lang_table = "**My 💖 languages " + fav + "**\n\n```text\n" + "\n".join(rows) + "\n```\n"
          repos = gql(
              'query { user(login: "%s") { repositories(first: 100, ownerAffiliations: OWNER) '
              '{ nodes { name isFork } } } }' % user)["user"]["repositories"]["nodes"]
          names = [n["name"] for n in repos if not n["isFork"]]
          LOC_Q = ("query($owner: String!, $name: String!, $id: ID!, $cursor: String) {"
                   " repository(owner: $owner, name: $name) { defaultBranchRef { target { ... on Commit {"
                   " history(first: 100, author: {id: $id}, after: $cursor) {"
                   " pageInfo { hasNextPage endCursor } nodes { additions deletions } } } } } } }")
          add = rem = 0
          for name in names:  # ponytail: sequential; dozens of repos finish in ~1 min, parallelize if hundreds
              cursor = None
              try:
                  while True:
                      ref = gql(LOC_Q, {"owner": user, "name": name, "id": uid, "cursor": cursor}
                                )["repository"]["defaultBranchRef"]
                      if ref is None:
                          break
                      h = ref["target"]["history"]
                      add += sum(n["additions"] for n in h["nodes"])
                      rem += sum(n["deletions"] for n in h["nodes"])
                      if not h["pageInfo"]["hasNextPage"]:
                          break
                      cursor = h["pageInfo"]["endCursor"]
              except Exception as e:
                  print(f"loc {name}: {e}")

          from urllib.parse import quote
          blue = "https://img.shields.io/static/v1?label=%20&message=" + quote(f"{commits:,}") + "&color=58a6ff&style=flat-square"
          green = "https://img.shields.io/static/v1?label=%20&message=" + quote(f"{add:,}++") + "&color=3fb950&style=flat-square"
          red = "https://img.shields.io/static/v1?label=%20&message=" + quote(f"{rem:,}--") + "&color=f85149&style=flat-square"
          block = (f"**Commits:** <img alt=\"{commits:,} commits\" src=\"{blue}\" />\n\n"
                   f"**Lines of Code:** {add - rem:,} ( <img alt=\"{add:,} lines added\" src=\"{green}\" /> <img alt=\"{rem:,} lines removed\" src=\"{red}\" /> )\n\n"
                   + lang_table)
          p = "README.md"
          s = open(p).read()
          open(p, "w").write(re.sub(
              r"(<!--START_SECTION:readme-info-->).*?(<!--END_SECTION:readme-info-->)",
              lambda m: m.group(1) + "\n" + block + "\n" + m.group(2), s, flags=re.S))
          print(f"commits={commits} loc={add - rem} (+{add}/-{rem}) repos={len(names)}")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git pull --rebase --autostash
          git add README.md
          git diff --cached --quiet && echo "no changes" || (git commit -qm "⤴ Auto update commits & lines of code" && git push)
